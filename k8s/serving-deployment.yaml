apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlops-serving-deployment
  namespace: ml-training
  labels:
    app: mlops-serving

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: mlops-serving

  template:
    metadata:
      labels:
        app: mlops-serving

    spec:
      containers:
      - name: mlops-serving-container

        image: mlops-serve:v2
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080
          name: http

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5

        volumeMounts:
        - name: checkpoint-storage
          mountPath: /app/checkpoints
          subPath: checkpoints
          readOnly: true

      volumes:
      - name: checkpoint-storage
        persistentVolumeClaim:
          claimName: model-checkpoint-pvc
