apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-training-job
  namespace: ml-training
  labels:
    app: mlops-training
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: mlops-training
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mlops-training-container
        image: mlops-train:v2
        imagePullPolicy: IfNotPresent
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: config-volume
          mountPath: /app/configs
        - name: storage-volume
          mountPath: /app/data
          subPath: data
        - name: storage-volume
          mountPath: /app/checkpoints
          subPath: checkpoints
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: config-volume
        configMap:
          name: training-config
      - name: storage-volume
        persistentVolumeClaim:
          claimName: model-checkpoint-pvc
      - name: dshm
        emptyDir:
          medium: Memory
